services:
  postgres:
    image: postgres:15
    container_name: dropvox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dropvox}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dropvox-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: dropvox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY: on
      MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY: kafka:29092
      MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY: ${KAFKA_MINIO_EVENTS_TOPIC:-minio-object-events}
      MINIO_NOTIFY_KAFKA_TLS_PRIMARY: off
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - dropvox-net
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: dropvox-kafka
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:29093}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:--W73uKF8TyqcEBRt1AVdRQ}
    ports:
      - "9092:9092"
    networks:
      - dropvox-net
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  minio-event-setup:
    image: minio/mc:latest
    container_name: dropvox-minio-event-setup
    depends_on:
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-dropvox-files};
      mc event remove --force local/${S3_BUCKET:-dropvox-files};
      mc event add local/${S3_BUCKET:-dropvox-files} arn:minio:sqs::PRIMARY:kafka --event put;
      "
    networks:
      - dropvox-net

  dropvox-gateway:
    build:
      context: .
      dockerfile: ./dropvox-gateway/Dockerfile
    container_name: dropvox-gateway
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_HOST: dropvox-auth
      AUTH_SERVICE_PORT: 8081
      METADATA_SERVICE_HOST: dropvox-metadata
      METADATA_SERVICE_PORT: 8082
      WEBCLIENT_METADATA_POOL_SIZE: 32
      KAFKA_ENABLED: true
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_UPLOAD_COMPLETION_REQUESTED_TOPIC: ${KAFKA_UPLOAD_COMPLETION_REQUESTED_TOPIC:-file-upload-completion-requested}
    ports:
      - "8080:8080"
    depends_on:
#      - dropvox-auth
      - kafka
      - dropvox-metadata
    networks:
      - dropvox-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

#  dropvox-auth:
#    build:
#      context: .
#      dockerfile: ./dropvox-auth/Dockerfile
#    container_name: dropvox-auth
#    environment:
#      SERVER_PORT: 8081
#    ports:
#      - "8081:8081"
#    depends_on:
#      postgres:
#        condition: service_healthy
#    networks:
#      - dropvox-net
#    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost:8081/health/live" ]
#      interval: 10s
#      timeout: 5s
#      retries: 5

  dropvox-metadata:
    build:
      context: .
      dockerfile: ./dropvox-metadata/Dockerfile
    container_name: dropvox-metadata
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-dropvox}
      DB_SCHEME: ${DB_SCHEME:-metadata}
      DB_USER: ${POSTGRES_USER:-user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      DB_POOL_MAX_SIZE: 20
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-dropvox-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      PRESIGNED_URL_EXPIRY_MINUTES: ${S3_PRESIGNED_URL_EXPIRY_MINUTES:-5}
      KAFKA_ENABLED: true
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_UPLOAD_COMPLETION_REQUESTED_TOPIC: ${KAFKA_UPLOAD_COMPLETION_REQUESTED_TOPIC:-file-upload-completion-requested}
      KAFKA_UPLOAD_COMPLETION_REQUESTED_GROUP_ID: ${KAFKA_UPLOAD_COMPLETION_REQUESTED_GROUP_ID:-metadata-upload-completion-workers}
      KAFKA_MINIO_EVENTS_TOPIC: ${KAFKA_MINIO_EVENTS_TOPIC:-minio-object-events}
      KAFKA_MINIO_EVENTS_GROUP_ID: ${KAFKA_MINIO_EVENTS_GROUP_ID:-metadata-minio-events}
      MINIO_KAFKA_NOTIFICATIONS_ENABLED: ${MINIO_KAFKA_NOTIFICATIONS_ENABLED:-true}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-event-setup:
        condition: service_completed_successfully
    networks:
      - dropvox-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: dropvox-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - dropvox-net

  loki:
    image: grafana/loki:3.7.0
    container_name: dropvox-loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    networks:
      - dropvox-net

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: dropvox-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - dropvox-net

  grafana:
    image: grafana/grafana:13.0.1
    container_name: dropvox-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards/dropvox:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - dropvox-net

volumes:
  pgdata:
  miniodata:
  promdata:
  lokidata:
  alloydata:
  grafanadata:

networks:
  dropvox-net:
    driver: bridge
