# HTTP server
server.port=9082

# PostgreSQL
db.host=localhost
db.port=5432
db.database=dropvox
db.scheme=metadata
db.user=user
db.password=pass
db.pool.maxSize=20

# MinIO / S3
s3.endpoint=http://localhost:9000
s3.publicEndpoint=http://localhost:9000
s3.accessKey=minioadmin
s3.secretKey=minioadmin
s3.bucket=dropvox-files
s3.region=us-east-1

# Kafka
kafka.enabled=false
kafka.bootstrap.servers=localhost:9092
kafka.upload.completion.requested.topic=file-upload-completion-requested
kafka.upload.completion.requested.group.id=metadata-upload-completion-workers
kafka.minio.events.topic=minio-object-events
kafka.minio.events.group.id=metadata-minio-events
minio.kafka.notifications.enabled=false

# Upload completion retry behavior
upload.completion.max.s3.existence.check.attempts=5
upload.completion.s3.existence.retry.delay.ms=200

